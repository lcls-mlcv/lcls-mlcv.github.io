# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: jpegify-images
        name: Normalize png/jpg assets to optimized JPEG
        entry: assets/img/jpegify.sh
        language: system
        pass_filenames: true
        files: (?i)^assets/img/.*\\.(png|jpe?g)$
        args:
          - --width
          - "1600"
          - --dpi
          - "96"
          - --quality
          - "85"
          - --replace
